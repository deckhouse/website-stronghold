apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-proxy
  annotations:
    "werf.io/replicas-on-creation": "1"
    "werf.io/weight": "2"
  labels:
    service: registry-proxy
    app.kubernetes.io/part-of: deckhouse-web-{{ .Values.productCode }}
spec:
  minReadySeconds: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      service: registry-proxy
  template:
    metadata:
      labels:
        service: registry-proxy
    spec:
      imagePullSecrets:
        - name: deckhouse-registry-site
      priorityClassName: {{ pluck .Values.werf.env .Values.priorityClassName | first | default .Values.priorityClassName._default }}
      containers:
        - name: registry-proxy
          image: {{ index .Values.werf.image "proxy-server" }}
          env:
            - name: PATH_PREFIX
              value: /products/{{ .Values.productCode }}/get
          {{- include "resources" . | nindent 10 }}
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            {{- include "startup_probe" . | indent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            {{- include "liveness_probe" . | indent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            {{- include "readiness_probe" . | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-proxy
spec:
  selector:
    service: registry-proxy
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-proxy
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: registry-proxy
  updatePolicy:
    updateMode: "Auto"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry-proxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      service: registry-proxy
